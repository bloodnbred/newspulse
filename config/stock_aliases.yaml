# How headlines refer to companies. Extend after reading real matches in the audit sample.
# ambiguous: aliases that are also common words or group names -> need business context to count
# case_sensitive: short tickers/abbreviations that must match exact case
context_words: [shares, share, stock, stocks, sensex, nifty, profit, loss, quarter, q1, q2, q3, q4, results,
                earnings, dividend, ipo, market, investors, brokerage, target, rating, merger, acquisition,
                stake, revenue, rbi, bse, nse, rally, slump, surge, fall, falls, gains]
use_topic_as_context: Business      # a headline whose topic is Business also counts as context
aliases:
  RELIANCE:   {names: ["Reliance Industries", "Reliance", "RIL"], ambiguous: ["Reliance"], case_sensitive: ["RIL"]}
  TCS:        {names: ["TCS", "Tata Consultancy"], case_sensitive: ["TCS"]}
  HDFCBANK:   {names: ["HDFC Bank"]}
  HDFC:       {names: ["HDFC"], ambiguous: ["HDFC"], case_sensitive: ["HDFC"]}
  INFY:       {names: ["Infosys"]}
  ICICIBANK:  {names: ["ICICI Bank"]}
  HINDUNILVR: {names: ["Hindustan Unilever", "HUL"], case_sensitive: ["HUL"]}
  ITC:        {names: ["ITC"], ambiguous: ["ITC"], case_sensitive: ["ITC"]}
  SBIN:       {names: ["State Bank of India", "SBI"], ambiguous: ["SBI"], case_sensitive: ["SBI"]}
  BHARTIARTL: {names: ["Bharti Airtel", "Airtel"]}
  KOTAKBANK:  {names: ["Kotak Mahindra Bank", "Kotak Bank"]}
  LT:         {names: ["Larsen & Toubro", "L&T"], ambiguous: ["L&T"]}
  AXISBANK:   {names: ["Axis Bank"]}
  ASIANPAINT: {names: ["Asian Paints"]}
  MARUTI:     {names: ["Maruti Suzuki", "Maruti"], ambiguous: ["Maruti"]}
  SUNPHARMA:  {names: ["Sun Pharma", "Sun Pharmaceutical"]}
  TITAN:      {names: ["Titan"], ambiguous: ["Titan"]}
  BAJFINANCE: {names: ["Bajaj Finance"]}
  BAJAJFINSV: {names: ["Bajaj Finserv"]}
  WIPRO:      {names: ["Wipro"]}
  HCLTECH:    {names: ["HCL Technologies", "HCL Tech"]}
  TECHM:      {names: ["Tech Mahindra"]}
  ONGC:       {names: ["ONGC"], case_sensitive: ["ONGC"]}
  NTPC:       {names: ["NTPC"], case_sensitive: ["NTPC"]}
  POWERGRID:  {names: ["Power Grid"], ambiguous: ["Power Grid"]}
  COALINDIA:  {names: ["Coal India"]}
  BPCL:       {names: ["BPCL", "Bharat Petroleum"], case_sensitive: ["BPCL"]}
  IOC:        {names: ["Indian Oil", "IOC"], ambiguous: ["Indian Oil", "IOC"], case_sensitive: ["IOC"]}
  GAIL:       {names: ["GAIL"], case_sensitive: ["GAIL"]}
  TATAMOTORS: {names: ["Tata Motors"]}
  M&M:        {names: ["Mahindra & Mahindra", "M&M"], ambiguous: ["M&M"]}
  BAJAJ-AUTO: {names: ["Bajaj Auto"]}
  HEROMOTOCO: {names: ["Hero MotoCorp"]}
  EICHERMOT:  {names: ["Eicher Motors"]}
  DRREDDY:    {names: ["Dr Reddy's", "Dr. Reddy's"]}
  CIPLA:      {names: ["Cipla"]}
  TATASTEEL:  {names: ["Tata Steel"]}
  JSWSTEEL:   {names: ["JSW Steel"]}
  HINDALCO:   {names: ["Hindalco"]}
  VEDL:       {names: ["Vedanta"]}
  ULTRACEMCO: {names: ["UltraTech Cement", "UltraTech"]}
  GRASIM:     {names: ["Grasim"]}
  ADANIPORTS: {names: ["Adani Ports"]}
  NESTLEIND:  {names: ["Nestle India"]}
  BRITANNIA:  {names: ["Britannia"], ambiguous: ["Britannia"]}
  INDUSINDBK: {names: ["IndusInd Bank"]}
  YESBANK:    {names: ["Yes Bank"]}

  # --- added for Nifty 50 coverage (Phase V1) ---
  # The list above covers only 36 of the 50 current constituents. A mention
  # linker that cannot name 14 stocks in the index silently under-reports
  # coverage, so every constituent gets an entry.
  #
  # `ambiguous` marks an alias that is also an ordinary English word or a very
  # common acronym. Those only count when a business context word is present
  # (see context_words) or the headline's topic is Business, otherwise a
  # sentence about the colour indigo or the word bel would match a company.
  ADANIENT:   {names: ["Adani Enterprises", "Adani Enterprises Ltd", "Adani"], ambiguous: ["Adani"]}
  APOLLOHOSP: {names: ["Apollo Hospitals", "Apollo Hospital", "Apollo"], ambiguous: ["Apollo"]}
  # BEL is an ordinary English word. Case-sensitive and context-gated.
  BEL:        {names: ["Bharat Electronics", "BEL"], ambiguous: ["BEL"], case_sensitive: ["BEL"]}
  BSE:        {names: ["BSE Limited", "BSE"], ambiguous: ["BSE"], case_sensitive: ["BSE"]}
  # Eternal was Zomato until the 2025 rename. The analysis window is 2015-2020,
  # so headlines in scope say "Zomato", and this row is where they attach.
  ETERNAL:    {names: ["Eternal", "Zomato"], ambiguous: ["Eternal"], case_sensitive: ["Zomato"]}
  HDFCLIFE:   {names: ["HDFC Life", "HDFC Life Insurance"], ambiguous: ["HDFC Life"]}
  INDIGO:     {names: ["InterGlobe Aviation", "IndiGo", "Indigo"], ambiguous: ["Indigo"]}
  JIOFIN:     {names: ["Jio Financial", "Jio Financial Services"]}
  MAXHEALTH:  {names: ["Max Healthcare", "Max Health"], ambiguous: ["Max"]}
  SBILIFE:    {names: ["SBI Life", "SBI Life Insurance"], ambiguous: ["SBI Life"]}
  SHRIRAMFIN: {names: ["Shriram Finance", "Shriram Financial", "Shriram"], ambiguous: ["Shriram"]}
  TATACONSUM: {names: ["Tata Consumer Products", "Tata Consumer"]}
  # Tata Motors demerged in Oct 2025 into TMPV (passenger vehicles) and a CV
  # listing. The NSE list we fetch is today's, so it names TMPV - but every
  # headline inside our 2015-2020 window says "Tata Motors", which was the
  # single company then. Without this alias the window's Tata Motors news links
  # to nothing, because TATAMOTORS is no longer a member.
  TMPV:       {names: ["Tata Motors", "Tata Motors Ltd"]}
  TRENT:      {names: ["Trent", "Trent Ltd"], ambiguous: ["Trent"]}
