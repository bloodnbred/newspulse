# How headlines refer to companies. Extend after reading real matches in the audit sample.
# ambiguous: aliases that are also common words or group names -> need business context to count
# case_sensitive: short tickers/abbreviations that must match exact case
context_words: [shares, share, stock, stocks, sensex, nifty, profit, loss, quarter, q1, q2, q3, q4, results,
                earnings, dividend, ipo, market, investors, brokerage, target, rating, merger, acquisition,
                stake, revenue, rbi, bse, nse, rally, slump, surge, fall, falls, gains]
use_topic_as_context: Business      # a headline whose topic is Business also counts as context
aliases:
  RELIANCE:   {names: ["Reliance Industries", "Reliance", "RIL"], ambiguous: ["Reliance"], case_sensitive: ["RIL"]}
  TCS:        {names: ["TCS", "Tata Consultancy"], case_sensitive: ["TCS"]}
  HDFCBANK:   {names: ["HDFC Bank"]}
  HDFC:       {names: ["HDFC"], ambiguous: ["HDFC"], case_sensitive: ["HDFC"]}
  INFY:       {names: ["Infosys"]}
  ICICIBANK:  {names: ["ICICI Bank"]}
  HINDUNILVR: {names: ["Hindustan Unilever", "HUL"], case_sensitive: ["HUL"]}
  ITC:        {names: ["ITC"], ambiguous: ["ITC"], case_sensitive: ["ITC"]}
  SBIN:       {names: ["State Bank of India", "SBI"], ambiguous: ["SBI"], case_sensitive: ["SBI"]}
  BHARTIARTL: {names: ["Bharti Airtel", "Airtel"]}
  KOTAKBANK:  {names: ["Kotak Mahindra Bank", "Kotak Bank"]}
