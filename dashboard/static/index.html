<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indian News Warehouse</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230071E3'/><rect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/><rect x='8' y='15' width='16' height='3' rx='1.5' fill='white' opacity='.7'/><rect x='8' y='21' width='10' height='3' rx='1.5' fill='white' opacity='.45'/></svg>">
<script>
  // Set the theme before first paint so the page never flashes the wrong one.
  // A dashboard that opens white then snaps to black looks broken, and this is
  // the only place that can be prevented: a script in <head> runs before the
  // body renders anything.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("dwm-theme"); } catch (e) {}
    var prefersDark = window.matchMedia
      && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
  })();
</script>
</head>
<body>

<div class="shell">

  <!-- ── navigation ─────────────────────────────────────────────── -->
  <nav class="nav" aria-label="Sections">
    <div class="nav__brand">
      <span class="nav__mark" aria-hidden="true"></span>
      <span class="nav__brandtext">
        <strong>Indian News</strong>
        <span>Warehouse</span>
      </span>
    </div>

    <div class="nav__group">
      <div class="nav__grouplabel">Sections</div>
      <div id="nav-main" class="nav__items"></div>
    </div>

    <div class="nav__group" id="nav-subgroup" hidden>
      <div class="nav__grouplabel">Research questions</div>
      <div id="nav-sub" class="nav__items nav__items--sub"></div>
    </div>

    <div class="nav__foot">
      <button id="theme-toggle" class="nav__theme" type="button" aria-live="polite">
        <span class="nav__themeicon" aria-hidden="true"></span>
        <span id="theme-label">Dark</span>
      </button>
      <div id="nav-corpus" class="nav__corpus"></div>
    </div>
  </nav>

  <!-- ── main ───────────────────────────────────────────────────── -->
  <div class="main">

    <header class="topbar">
      <div class="topbar__left">
        <h1 id="page-title">Overview</h1>
        <p id="page-sub" class="topbar__sub"></p>
      </div>
      <div class="topbar__right">
        <div id="guard-badge" class="badge badge--guard" title="Inference gate">
          <span class="badge__dot"></span><span id="guard-text">checking…</span>
        </div>
        <div id="provenance" class="provenance"></div>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1">
      <div class="loading">
        <div class="loading__bar"></div>
        <p>Loading results…</p>
      </div>
    </main>

    <footer id="footer" class="footer"></footer>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12"></script>
<script src="/app.js"></script>
<!-- v2 views. Loaded after app.js because they reuse its helpers (api, chart,
     table, tabs, esc, md, state) rather than reimplementing them, and they
     register on window.DWM_V2 for render() to call. -->
<script src="/v2.js"></script>
</body>
</html>
